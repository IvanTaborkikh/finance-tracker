spring.application.name=finance-tracker

# Читає .env з кореня проєкту як properties-файл. optional: якщо файлу немає (наприклад, у CI), помилки не буде
spring.config.import=optional:file:.env[.properties]

# Підключення до БД. ${ЗМІННА:значення_за_замовчуванням}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:finance_tracker}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate НЕ створює і НЕ змінює таблиці. Тільки перевіряє, що entities збігаються зі схемою.
# Схемою керує виключно Flyway.
spring.jpa.hibernate.ddl-auto=validate
# Не тримати з'єднання з БД відкритим на весь HTTP-запит
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Пагінація: клієнт не може попросити більше 100 записів на сторінку
spring.data.web.pageable.max-page-size=100
